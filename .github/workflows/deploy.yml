name: CI

# El despliegue lo hace la integración nativa de Vercel con GitHub en cada
# push a main (y genera previews en los PRs). Este workflow solo valida.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
